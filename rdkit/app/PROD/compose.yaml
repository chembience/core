name: ${COMPOSE_PROJECT_NAME:?Run rdkit-prepare-prod first}

services:
  rdkit:
    image: ${CHEMBIENCE_PROD_IMAGE_NAME:?Run rdkit-prepare-prod first}:${CHEMBIENCE_IMAGE_TAG:?Set CHEMBIENCE_IMAGE_TAG in .env}
    env_file: .env
    environment:
      CHEMBIENCE_RUNTIME_MODE: prod
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${CHEMBIENCE_POSTGRES_IMAGE:?Set CHEMBIENCE_POSTGRES_IMAGE in .env}
    env_file: .env
    volumes:
      - postgres-data:/home/postgres
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["gosu", "app", "postgres", "-D", "/home/postgres/postgres_data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_NAME -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
