{{- if .Values.ingress.enabled }}{{ fail "ingress is not supported for the RDKit chart" }}{{ end }}
{{- if .Values.migration.enabled }}{{ fail "migration is not supported for the RDKit chart" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chembience.appConfigName" . }}
  labels: {{- include "chembience.labels" . | nindent 4 }}
data:
  CHEMBIENCE_RUNTIME_MODE: "prod"
  POSTGRES_HOST: {{ include "chembience.postgresHost" . | quote }}
  POSTGRES_PORT: "5432"
  POSTGRES_INTERNAL_PORT: "5432"
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_NAME: {{ .Values.postgres.database | quote }}
  {{- range $key, $value := .Values.app.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chembience.appName" . }}
  labels: {{- include "chembience.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "chembience.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "chembience.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "chembience.image" .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command: ["sh", "-c", "until pg_isready -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_NAME -p 5432; do sleep 2; done"]
          envFrom: [{configMapRef: {name: {{ include "chembience.appConfigName" . }}}}]
          env: [{name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.app.existingSecret }}, key: {{ .Values.postgres.passwordKey }}}}}]
      {{- end }}
      containers:
        - name: rdkit
          image: {{ include "chembience.image" .Values.app.image | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command: ["tail", "-f", "/dev/null"]
          envFrom: [{configMapRef: {name: {{ include "chembience.appConfigName" . }}}}]
          env: [{name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ .Values.app.existingSecret }}, key: {{ .Values.postgres.passwordKey }}}}}]
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
