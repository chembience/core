name: ${COMPOSE_PROJECT_NAME:?Run django-prepare-prod first}

services:
  django:
    image: ${CHEMBIENCE_PROD_IMAGE_NAME:?Run django-prepare-prod first}:${CHEMBIENCE_IMAGE_TAG:?Set CHEMBIENCE_IMAGE_TAG in .env}
    env_file: .env
    environment:
      CHEMBIENCE_RUNTIME_MODE: prod
    ports:
      - "${DJANGO_CONNECTION_PORT:-8001}:8000"
    restart: unless-stopped
    command: ["python", "-m", "gunicorn", "src.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "${GUNICORN_WORKERS:-8}"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  migrate:
    image: ${CHEMBIENCE_PROD_IMAGE_NAME:?Run django-prepare-prod first}:${CHEMBIENCE_IMAGE_TAG:?Set CHEMBIENCE_IMAGE_TAG in .env}
    env_file: .env
    environment:
      CHEMBIENCE_RUNTIME_MODE: prod
    profiles: ["migration"]
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${CHEMBIENCE_POSTGRES_IMAGE:?Set CHEMBIENCE_POSTGRES_IMAGE in .env}
    env_file: .env
    volumes:
      - postgres-data:/home/postgres
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["gosu", "app", "postgres", "-D", "/home/postgres/postgres_data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_NAME -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
