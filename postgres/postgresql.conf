# Chembience PostgreSQL configuration
#
# docker-entrypoint.sh copies this file over the initdb-generated
# postgresql.conf when a new data directory is initialized. Only settings that
# differ from (or are pinned explicitly over) the PostgreSQL defaults are listed
# here; every other parameter keeps its built-in default. For the full list of
# parameters see the upstream sample (postgresql.conf.sample in the PostgreSQL
# share directory) or https://www.postgresql.org/docs/current/runtime-config.html

# Connections
listen_addresses = '*'		# access is restricted by pg_hba.conf
port = 5432
max_connections = 100

# Memory and WAL
shared_buffers = 128MB
dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB

# Locale and formatting
log_timezone = 'Etc/UTC'
datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

# Extensions
shared_preload_libraries = 'rdkit'	# RDKit cartridge (requires restart)
