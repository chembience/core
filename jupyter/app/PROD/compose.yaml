name: ${COMPOSE_PROJECT_NAME:?Run jupyter-prepare-prod first}

services:
  jupyter:
    image: ${CHEMBIENCE_PROD_IMAGE_NAME:?Run jupyter-prepare-prod first}:${CHEMBIENCE_IMAGE_TAG:?Set CHEMBIENCE_IMAGE_TAG in .env}
    env_file: .env
    environment:
      CHEMBIENCE_RUNTIME_MODE: prod
    ports:
      - "${JUPYTER_CONNECTION_PORT:-8888}:8888"
    restart: unless-stopped
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    image: ${CHEMBIENCE_POSTGRES_IMAGE:?Set CHEMBIENCE_POSTGRES_IMAGE in .env}
    env_file: .env
    volumes:
      - postgres-data:/home/postgres
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint.sh"]
    command: ["gosu", "app", "postgres", "-D", "/home/postgres/postgres_data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_NAME -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
