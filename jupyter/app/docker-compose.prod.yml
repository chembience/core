services:
  jupyter:
    image: ${CHEMBIENCE_PROD_IMAGE_NAME:?Run jupyter-prepare-prod first}:${CHEMBIENCE_IMAGE_TAG:?Set CHEMBIENCE_IMAGE_TAG in .env.prod}
    env_file: .env.prod
    environment:
      CHEMBIENCE_RUNTIME_MODE: prod
    ports:
      - "${JUPYTER_CONNECTION_PORT:-8888}:8888"
    restart: unless-stopped
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
