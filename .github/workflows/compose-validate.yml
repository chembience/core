name: Compose Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare .env
        run: |
          if [ -f .env.template ]; then
            cp .env.template .env
            printf '\nCHEMBIENCE_VERSION=%s\n' "$(tr -d '[:space:]' < VERSION)" >> .env
          fi

      - name: Validate base compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate dev overlay
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
