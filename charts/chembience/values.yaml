# app.kind is the generated Chembience application type to deploy.
app:
  kind: django
  replicaCount: 1
  image:
    repository: chembience/example-prod
    tag: "replace-with-an-immutable-tag"
    pullPolicy: IfNotPresent
  existingSecret: chembience-secrets
  env: {}
  resources: {}
django:
  virtualHostname: ""
  csrfTrustedOrigins: ""
  trustXForwardedProto: true
  secretKeyKey: django-secret-key
jupyter:
  tokenKey: jupyter-token
# postgres deploys the bundled, single-node RDKit PostgreSQL database.
postgres:
  enabled: true
  # host is required only when enabled is false.
  host: ""
  image:
    repository: chembience/core-rdkit-postgres
    tag: "0.6.2"
    pullPolicy: IfNotPresent
  existingSecret: chembience-secrets
  user: chembience
  database: chembience
  passwordKey: postgres-password
  persistence:
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  resources: {}
# migration creates a one-shot Job for Django and FastAPI migrations.
migration:
  enabled: false
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
