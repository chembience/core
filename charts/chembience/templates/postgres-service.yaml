{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chembience.postgresName" . }}
  labels:
    {{- include "chembience.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "chembience.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
