apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chembience.appName" . }}
  labels:
    {{- include "chembience.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "chembience.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "chembience.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "chembience.image" .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command: ["sh", "-c", "until pg_isready -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_NAME -p 5432; do sleep 2; done"]
          envFrom:
            - configMapRef:
                name: {{ include "chembience.appConfigName" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret }}
                  key: {{ .Values.postgres.passwordKey }}
      {{- end }}
      containers:
        - name: {{ .Values.app.kind }}
          image: {{ include "chembience.image" .Values.app.image | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "chembience.appConfigName" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret }}
                  key: {{ .Values.postgres.passwordKey }}
            {{- if eq .Values.app.kind "django" }}
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret }}
                  key: {{ .Values.django.secretKeyKey }}
            {{- end }}
            {{- if eq .Values.app.kind "jupyter" }}
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.existingSecret }}
                  key: {{ .Values.jupyter.tokenKey }}
            {{- end }}
          {{- if eq .Values.app.kind "django" }}
          command: ["python", "-m", "gunicorn", "src.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "8"]
          {{- else if eq .Values.app.kind "fastapi" }}
          command: ["sh", "-c", "exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"]
          {{- else if eq .Values.app.kind "jupyter" }}
          command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
          {{- else }}
          command: ["tail", "-f", "/dev/null"]
          {{- end }}
          {{- if ne .Values.app.kind "rdkit" }}
          ports:
            - name: http
              containerPort: {{ include "chembience.appPort" . }}
          readinessProbe:
            httpGet:
              path: {{ if eq .Values.app.kind "jupyter" }}/api{{ else if eq .Values.app.kind "django" }}/healthz/{{ else }}/healthz{{ end }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ if eq .Values.app.kind "jupyter" }}/api{{ else if eq .Values.app.kind "django" }}/healthz/{{ else }}/healthz{{ end }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
